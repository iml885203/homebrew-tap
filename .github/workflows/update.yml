name: Update formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check latest Tunlease release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/iml885203/tunlease/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -nE 's|.*tags/v([^/]+)\.tar\.gz.*|\1|p' Formula/tunlease.rb)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$current" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update formula
        if: steps.release.outputs.current != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          url="https://github.com/iml885203/tunlease/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i -E "s|url \".*\"|url \"${url}\"|" Formula/tunlease.rb
          sed -i -E "s|sha256 \".*\"|sha256 \"${sha}\"|" Formula/tunlease.rb
      - name: Open update pull request
        if: steps.release.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="automation/tunlease-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Formula/tunlease.rb
          git commit -m "tunlease ${VERSION}"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "tunlease ${VERSION}" \
              --body "Automated source formula update for Tunlease ${VERSION}."
          fi
          gh workflow run test.yml --ref "$branch"
