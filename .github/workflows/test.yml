name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install workflow test dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Validate formula
        run: |
          python3 .github/scripts/semver-not-older.py --self-test
          python3 .github/scripts/test-release-security.py
          brew style --formula iml885203/tap/tunlease
          brew audit --strict --new --online iml885203/tap/tunlease
          brew install --build-from-source iml885203/tap/tunlease
          brew test iml885203/tap/tunlease
          brew style --formula iml885203/tap/orbit
          brew audit --strict --new --online iml885203/tap/orbit
          brew install iml885203/tap/orbit
          brew test iml885203/tap/orbit
